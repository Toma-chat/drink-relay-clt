<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>スタッフパスワード再設定</title>
  <script src="./store-config.js"></script>
  <script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script defer src="./password-reset.js"></script>
  <style>body{font-family:system-ui;background:#fff7ed;color:#292524;margin:0;padding:24px}main{max-width:480px;margin:40px auto;background:white;border-radius:20px;padding:28px}label,input,button{display:block;box-sizing:border-box;width:100%;font-size:18px}input{padding:14px;margin:10px 0 24px;border:1px solid #aaa;border-radius:8px}button{padding:16px;background:#f97316;color:white;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.7;overflow-wrap:anywhere}[hidden]{display:none}</style>
</head>
<body><main>
  <h1>スタッフパスワード再設定</h1>
  <p id="resetStatus" role="status" aria-live="polite">接続を確認しています…</p>
  <form id="requestReset" hidden>
    <label>スタッフメール<input name="email" type="email" autocomplete="username" required></label>
    <button>再設定メールを送る</button>
    <p>メールのリンクを開き、新しいパスワードを設定してください。</p>
  </form>
  <form id="savePassword" hidden>
    <label>新しいパスワード<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>もう一度入力<input name="confirmation" type="password" autocomplete="new-password" minlength="8" required></label>
    <button>新しいパスワードを保存</button>
  </form>
  <a href="./index.html">注文アプリへ戻る</a>
</main></body>
</html>
